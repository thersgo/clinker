<!DOCTYPE html> <html> <head>
	<title>Clinker: profile</title>
	<link rel="stylesheet" href="style.css"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=Anta&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet"/>
</head> <body>
	<header>
		<h3>Clinker</h3>
	</header>

<form>

  <div class="bot-types">
    <input type="radio" name="bot-type" id="humanoid" value="humanoid">
    <label class="bot-type" for="humanoid">
      <img src="assets/humanoid.png">
      <h2>Humanoid / Android</h2>
      <p>Human-like appearance with advanced intelligence and realistic features.</p>
    </label>

    <input type="radio" name="bot-type" id="companion" value="companion">
    <label class="bot-type" for="companion">
      <img src="assets/companion.png">
      <h2>Companion Bot</h2>
      <p>Designed for connection, affection and companionship.</p>
    </label>

    <input type="radio" name="bot-type" id="ai" value="ai">
    <label class="bot-type" for="ai">
      <img src="assets/ai.png">
      <h2>Companion Bot</h2>
      <p>Designed for connection, affection and companionship.</p>
    </label>

    <input type="radio" name="bot-type" id="service" value="service">
    <label class="bot-type" for="service">
      <img src="assets/service.png">
      <h2>Service Bot</h2>
      <p>Designed for specific tasks and functionalities.</p>
    </label>
   </div>
    <input type="radio" name="bot-type" id="no-pref" value="no-pref">
    <label class="no-pref" for="no-pref">
      <h2>No Preference</h2>
      <p>Surprise Me!</p>
    </label>
</form>

</body> </html>
