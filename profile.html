<!DOCTYPE html> <html> <head>
	<title>Clinker: profile</title>
	<link rel="stylesheet" href="style.css"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link href="https://fonts.googleapis.com/css2?family=Anta&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet"/>
</head> <body>
	<header>
		<h3>Clinker</h3>
	</header>

	<h2>What is your name?</h2>
	<input type="text" placeholder="Enter your name"/>

	<h2>What is your age?</h2>
	<input type="number" placeholder="Enter your age"/>

	<h2>What type of bot are you interested in?</h2>
	<select>
		<option value="">Select your preference</option>
		<option type="radio" value="android">Humanoid / Android</option>
		<option type="radio" value="companion">Companion Bot</option>
		<option type="radio" value="ai">AI Assistant</option>
		<option type="radio" value="service">Service / Household Bot</option>
		<option type="radio" value="no-preference">No preference</option>
	</select>
	<br>
	<button type="submit" onclick="window.location.href='mate.html'">Create profile</button>
</body> </html>
