<!DOCTYPE html> <html> <head>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anta&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap"/>
	
	<link rel="stylesheet" href="reset.css"/>
	<link rel="stylesheet" href="style.css"/>
	
	<title>Clinker: profile</title>
	
	<style>
		.options {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
			gap: 1rem;
			margin: 1rem;
			
		}
		
		.options img, h2, p {
			text-wrap: wrap;
		}
		
		.options img {
			height: 16rem;
			object-fit: cover;
		}
		
		.option {
			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			height: 380px;
			
			cursor: pointer;
			border: 2px solid transparent;
			padding: 1rem;
		}
		
		.options input[type="radio"]:checked + label {
			border-color: #333;
		}
		
		.options input[type="radio"]:focus-visible + label  {
			outline: 2px solid #333;
		}
		
		.options input[type="radio"] {
			position: absolute;
			opacity: 0;
		}
	</style>
</head> <body>
	<nav>
		<a href="./index.html" style="
			display: flex;
			flex-direction: row;
			align-items: center;
			text-decoration: inherit;
			color: inherit;
			gap: 1rem;
		">
			<img src="assets/icon.png" width="48"/>
			<p class="anta" style="font-size: 1.5rem; line-height: 20px;">Clinker</p>
		</a>
	</nav> <main style="
		min-height: 100%;
	"> 
		<form id="matchForm" action="mate.html" style="
			display: flex;
			flex-direction: column;
			gap: 2rem;
			padding: 2rem 1rem;
		">
			<div>
				<h2>What is your name?</h2>
				<input type="text" placeholder="Enter your name"/>
			</div>
			
			<div>
				<h2>What is your birthday?</h2>
				<input type="date" placeholder="Enter your age"/>
			</div>
			
			<div>
				<h2>What type of bot are you interested in?</h2>
				<div class="options">
					<div style="
						display:        flex;
						flex-direction: column;
						min-width:      0;
						width:          100%;
						padding:        0.5rem;
						gap:            0.5rem;
						border:         4px solid var(--accent);
						border-radius:  0.5rem;
					">
						<div style="
							display:        flex;
							flex-direction: column;
							gap:            1rem;
						">
							<input type="radio" name="type" id="humanoid" value="humanoid">
							<label class="option" for="humanoid">
								<img src="assets/humanoid.png" style="
									object-fit: cover;
									border-radius: 0.5rem;
								">
								<h2 class="anta">Humanoid / Android</h2>
								<p>Human-like appearance with advanced intelligence and realistic features.</p>
							</label>
						</div>
					</div>
					
					<div style="
						display:        flex;
						flex-direction: column;
						min-width:      0;
						width:          100%;
						padding:        0.5rem;
						gap:            0.5rem;
						border:         4px solid var(--accent);
						border-radius:  0.5rem;
					">
						<div style="
							display: flex;
							flex-direction: column;
							gap: 1rem;
						">
							<input type="radio" name="type" id="companion" value="companion">
							<label class="option" for="companion">
								<img src="assets/companion.png" style="
									object-fit: cover;
									border-radius: 0.5rem;
								">
								<h2 class="anta">Companion Bot</h2>
								<p>Designed for connection, affection and companionship.</p>
							</label>
						</div>
					</div>
					
					<div style="
						display:        flex;
						flex-direction: column;
						min-width:      0;
						width:          100%;
						padding:        0.5rem;
						gap:            0.5rem;
						border:         4px solid var(--accent);
						border-radius:  0.5rem;
					">
						<div style="
							display: flex;
							flex-direction: column;
							gap: 1rem;
						">
							<input type="radio" name="type" id="ai" value="ai">
							<label class="option" for="ai">
								<img src="assets/ai.png">
								<h2>AI Assistant</h2>
								<p>Smart, helpful and always ready to chat or assist</p>
							</label>
						</div>
					</div>
					
					<div style="
						display:        flex;
						flex-direction: column;
						min-width:      0;
						width:          100%;
						padding:        0.5rem;
						gap:            0.5rem;
						border:         4px solid var(--accent);
						border-radius:  0.5rem;
					">
						<div style="
							display: flex;
							flex-direction: column;
							gap: 1rem;
						">
							<input type="radio" name="type" id="service" value="service">
							<label class="option" for="service">
								<img src="assets/service.png">
								<h2>Service Bot</h2>
								<p>Designed for specific tasks and functionalities.</p>
							</label>
						</div>
					</div>
					
					<div style="
						display:        flex;
						flex-direction: column;
						min-width:      0;
						width:          100%;
						padding:        0.5rem;
						gap:            0.5rem;
						border:         4px solid var(--accent);
						border-radius:  0.5rem;
					">
						<div style="
							display: flex;
							flex-direction: column;
							gap: 1rem;
						">
							<input type="radio" name="type" id="no-pref" value="no-pref">
							<label class="option" for="no-pref">
								<img src="assets/question.png">
								<h2>No Preference</h2>
								<p>Surprise Me!</p>
							</label>
						</div>
					</div>
				</div>
			</div>
			<br>
			<button
				type="submit"
				style="
					display: flex;
					width: fit-content;
					padding: 1rem 2rem;
					align-self: center;
					justify-content: center;
					font-size: 2rem;
				"
			>
				Create profile
			</button>
		</form>
	</main> <footer>
		
	</footer>
</body> </html>
